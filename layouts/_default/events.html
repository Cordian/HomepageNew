{{ define "main" }}
<main id="main">
<div class="wrap">
<section class="first">
  <h2 class="pagetitle">{{ .Title }}</h2>
  <div class="prose">{{ .Content }}</div>
  {{ with .Params.photo }}
  <figure class="photo">
    <img src="{{ .src }}" alt="{{ .alt }}" width="1600" height="798" loading="lazy">
    {{ with .caption }}<figcaption>{{ . }}</figcaption>{{ end }}
  </figure>
  {{ end }}
  <figure class="map">
    {{ readFile "static/images/events-map.svg" | safeHTML }}
    <figcaption>Where I have organized conferences, workshops and schools. Hover a dot for the events; Tromsø is home.</figcaption>
  </figure>
  <dl class="roles" style="margin-top:1.6rem">
  {{ range site.Data.events }}
    <div><dt>{{ if .url }}<a href="{{ .url }}">{{ .name }}</a>{{ else }}{{ .name }}{{ end }}{{ with .detail }} &mdash; <span class="detail">{{ . | safeHTML }}</span>{{ end }}{{ with .photo }}<figure class="eventphoto"><img src="{{ . }}" alt="" loading="lazy"></figure>{{ end }}</dt><dd>{{ .when }}</dd></div>
  {{ end }}
  </dl>
</section>
</div>
</main>
{{ end }}
