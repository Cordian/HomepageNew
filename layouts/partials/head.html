<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<title>{{ if .IsHome }}{{ site.Title }} &mdash; Professor of Mathematics, UiT{{ else }}{{ .Title }} &mdash; {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Params.description | default site.Params.description }}">
{{- $ogtitle := cond .IsHome (printf "%s — Professor of Mathematics, UiT" site.Title) (printf "%s — %s" .Title site.Title) }}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ $ogtitle }}">
<meta property="og:description" content="{{ .Params.description | default site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/og.jpg" | absURL }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cordian Riener — northern lights over Tromsø">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $ogtitle }}">
<meta name="twitter:image" content="{{ "images/og.jpg" | absURL }}">
<link rel="stylesheet" href="/css/style.css">
